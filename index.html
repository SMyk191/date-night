<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Date for Bhavana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600,100&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: sweet, a little flirty, confident; a note from Samyak
   IDEA a pocket app that ends in a little admit-two date ticket
   PICTURE a sticker-style illustration per stop: pottery wheel, dinner table, chocolate cake, then the ticket
   COLOUR strawberry-milk pink ground, berry ink, strawberry accent; each stop gets its own sticker colour; night is deep berry
   TYPE Fraunces soft display + Plus Jakarta Sans
   LAYOUT phone-shaped column, progress on top, sticky button at the bottom; on a laptop it floats on the pink field */
:root{color-scheme:light dark;--bg:light-dark(#ffeef3,#170c12);--blob1:light-dark(#ffd3e1,#3a1426);--blob2:light-dark(#ffe6d2,#2a1630);--ink:light-dark(#2b1320,#fbe8ef);--muted:light-dark(#8b5a6d,#c79aac);--card:light-dark(#ffffff,#241520);--tint:light-dark(#fff5f8,#2d1a27);--line:light-dark(#f7d4e0,#3e2534);--accent:light-dark(#ff3d73,#ff6992);--accent2:light-dark(#ffb4c8,#7a2a49);--choco:#4a241c;--mango:#ffb648;--mint:#38c08f;--sky:#6aa8ff;--peach:#ff9b6a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgfx::before,.bgfx::after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(10px)}
.bgfx::before{background:radial-gradient(circle,var(--blob1) 0,transparent 65%);top:-30vmax;left:-25vmax}
.bgfx::after{background:radial-gradient(circle,var(--blob2) 0,transparent 65%);bottom:-35vmax;right:-25vmax}
.bgfx svg{position:absolute;bottom:-40px;width:22px;height:22px;fill:var(--accent2);animation:drift linear infinite}
@keyframes drift{to{transform:translateY(-115vh) rotate(25deg)}}
.app{position:relative;z-index:1;width:min(100%,460px);margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 18px 0}
.bar{display:flex;align-items:center;gap:12px;min-height:48px}
.back{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.back svg{width:20px;height:20px}
.prog{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.prog i{height:6px;border-radius:6px;background:var(--line);overflow:hidden;position:relative}
.prog i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .45s ease}
.prog i.on::after{transform:scaleX(1)}
.count{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.body{flex:1;padding:6px 0 18px}
.hero{position:relative;border-radius:30px;overflow:hidden;margin:6px 0 18px;aspect-ratio:16/11;display:grid;place-items:center}
.hero svg{width:100%;height:100%}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:5px 12px;border-radius:999px;margin-bottom:10px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-variation-settings:"SOFT" 100;line-height:1.05;letter-spacing:-.02em;text-wrap:balance;margin:0 0 10px}
h1{font-size:clamp(34px,9vw,44px)}
h2{font-size:clamp(28px,7.5vw,34px)}
.sub{color:var(--muted);font-size:16.5px;margin:0 0 18px}
.q{font-weight:700;font-size:17px;margin:20px 0 10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.day{position:relative;border:0;cursor:pointer;font:inherit;color:var(--ink);background:var(--card);border-radius:24px;padding:18px 14px 16px;box-shadow:0 0 0 2px var(--line);text-align:left;transition:transform .2s,box-shadow .2s,background .2s}
.day small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.day b{display:block;font-family:Fraunces,serif;font-weight:600;font-variation-settings:"SOFT" 100;font-size:26px;line-height:1.1;margin:4px 0}
.day span{font-size:14px;color:var(--muted)}
.day.sel{background:var(--accent);color:#fff;box-shadow:0 0 0 2px var(--accent);transform:translateY(-2px) rotate(-1.5deg)}
.day.sel small,.day.sel span{color:#ffe3ea}
.list{display:grid;gap:12px}
.pick{display:flex;gap:14px;align-items:center;width:100%;border:0;cursor:pointer;font:inherit;color:var(--ink);text-align:left;background:var(--card);border-radius:24px;padding:14px;box-shadow:0 0 0 2px var(--line);transition:transform .2s,box-shadow .2s}
.pick .ic{flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center}
.pick .ic svg{width:44px;height:44px}
.pick b{display:block;font-weight:700;font-size:17px;line-height:1.25}
.pick p{margin:2px 0 6px;font-size:14.5px;color:var(--muted);line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags em{font-style:normal;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--muted)}
.pw{display:grid;gap:4px}
.photos{justify-self:end;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 6px;font-size:13.5px;font-weight:700;color:var(--accent);text-decoration:none}
.photos svg{width:15px;height:15px}
.radio{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;transition:background .2s}
.radio svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.pick.sel{box-shadow:0 0 0 2.5px var(--accent);transform:scale(1.015)}
.pick.sel .radio{background:var(--accent);box-shadow:none}
.pick.sel .radio svg{opacity:1;transform:scale(1)}
.swap{display:flex;gap:12px;align-items:center;width:100%;margin-top:14px;border:2px dashed var(--accent2);background:transparent;color:var(--ink);border-radius:22px;padding:14px;font:inherit;text-align:left;cursor:pointer}
.swap .ic{flex:none;width:48px;height:48px;border-radius:16px;background:var(--peach);display:grid;place-items:center}
.swap .ic svg{width:32px;height:32px}
.swap b{display:block;font-size:15.5px}
.swap span{font-size:14px;color:var(--muted)}
.fine{font-size:13px;color:var(--muted);margin:14px 2px 0}
label{display:block;font-weight:700;margin:20px 0 8px}
textarea{width:100%;min-height:96px;resize:vertical;font:16px "Plus Jakarta Sans",sans-serif;color:var(--ink);background:var(--card);border:0;border-radius:20px;padding:14px 16px;box-shadow:0 0 0 2px var(--line)}
textarea:focus{outline:none;box-shadow:0 0 0 2.5px var(--accent)}
.ticket{position:relative;background:var(--card);border-radius:26px;box-shadow:0 0 0 2px var(--line);overflow:hidden;margin:4px 0 6px}
.ticket .top{background:var(--accent);color:#fff;padding:16px 20px 18px;position:relative}
.ticket .top small{font-weight:600;opacity:.9}
.ticket .top b{display:block;font-family:Fraunces,serif;font-weight:600;font-variation-settings:"SOFT" 100;font-size:26px;line-height:1.1}
.ticket .top svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:54px;height:54px}
.perf{height:22px;position:relative;background:radial-gradient(circle at 0 50%,var(--bg) 11px,transparent 12px),radial-gradient(circle at 100% 50%,var(--bg) 11px,transparent 12px)}
.perf::after{content:"";position:absolute;left:20px;right:20px;top:50%;border-top:2px dashed var(--line)}
.stops{list-style:none;margin:0;padding:4px 20px 18px}
.stops li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0}
.stops .dot{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.stops .dot svg{width:26px;height:26px}
.stops small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.stops b{font-size:16px;line-height:1.3}
.sent{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#fff;background:var(--mint);padding:8px 14px 8px 10px;border-radius:999px;margin:0 0 14px}
.sent svg{width:18px;height:18px}
.err{min-height:0;margin:0 0 8px;text-align:center;font-weight:600;font-size:14px;color:var(--accent)}
.cta{position:sticky;bottom:0;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:3}
.btn{width:100%;min-height:58px;border:0;border-radius:20px;background:var(--accent);color:#fff;font:700 17px "Plus Jakarta Sans",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px -10px var(--accent);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn svg{width:20px;height:20px}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line);margin-top:10px}
.link{display:block;margin:12px auto 0;border:0;background:none;color:var(--muted);font:600 14px "Plus Jakarta Sans",sans-serif;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.back:focus-visible,.btn:focus-visible,.pick:focus-visible,.day:focus-visible,.swap:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.enter{animation:slide .45s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{opacity:0;transform:translateX(26px)}}
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-5px)}}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{stroke-dashoffset:-56}}
.float{animation:rise 3s ease-in infinite;opacity:0;transform-box:fill-box}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1.15)}}
.twinkle{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{transform:scale(.4);opacity:.4}}
.pop{position:fixed;z-index:9;pointer-events:none;width:26px;height:26px;fill:var(--accent);animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-160%) scale(1.3);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.confetti svg{position:absolute;top:-30px;width:18px;height:18px;animation:fallc 3s ease-in forwards}
@keyframes fallc{to{transform:translateY(112vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){.bgfx svg,.confetti,.pop{display:none}.enter,.bob,.spin,.float,.twinkle{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="bgfx" id="bgfx" aria-hidden="true"></div>
<div class="app">
  <div class="bar">
    <button class="back" id="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="prog" id="prog"><i></i><i></i><i></i><i></i></div>
    <span class="count" id="count"></span>
  </div>
  <main class="body" id="stage" aria-live="polite"></main>
  <div class="cta" id="cta"></div>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <path id="h" d="M12 21s-7.5-4.6-9.6-9.1C.8 8.4 2.9 4.5 6.6 4.5c2.2 0 3.6 1.2 5.4 3.1 1.8-1.9 3.2-3.1 5.4-3.1 3.7 0 5.8 3.9 4.2 7.4C19.5 16.4 12 21 12 21z"/>
  <path id="spark" d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/>
  <linearGradient id="clay" x1="0" x2="1"><stop offset="0" stop-color="#f08a5d"/><stop offset="1" stop-color="#c85a35"/></linearGradient>
  <linearGradient id="choc" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6b3424"/><stop offset="1" stop-color="#3e1c14"/></linearGradient>
</defs></svg>
<script>
{
/* ---------- the plan ---------- */
/* her answers go to Samyak's Google Form, which fills his "Bhavana date picks (Responses)" sheet */
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSfFR8_DIRNbCpGozhnlXxpp-4p3F9NvU3EgKaHpIMlRZ1sB8A/formResponse";
const F = {status:"entry.1521330860", day:"entry.309795441", dinner:"entry.863558512", dessert:"entry.2019354707", at:"entry.1036678623", note:"entry.1133042577"};
const DAYS = [{id:"wed", day:"Wednesday", date:"25 Nov"},{id:"thu", day:"Thursday", date:"26 Nov"}];
const PLACES = [
  {id:"social", name:"Sarjapur SOCIAL", area:"Sarjapur Road", blurb:"Playful, loud in a fun way, and famous for its thick shakes.", tags:["Comfort food","Epic shakes"], icon:"shake", col:"var(--mango)", maps:"Sarjapur SOCIAL, Sarjapur Road, Bengaluru",
   desserts:[
     {name:"Layer Cake", desc:"Chocolate sponge hiding three kinds of mousse. Built for sharing (or not)."},
     {name:"Toblerone Shake", desc:"A whole Toblerone's worth of happiness, blended."},
     {name:"Ferrero Rocher Shake", desc:"Chocolate ice cream, rice crisp and a chocolate syrup drizzle."},
     {name:"Kit Kat Shake", desc:"Chocolate ice cream and Kit Kat. Have a break, have a shake."}
   ]},
  {id:"biergarten", name:"Biergarten", area:"Bellandur", blurb:"Leafy, garden-style space for a slow, cosy dinner.", tags:["Garden vibes","Continental"], icon:"leaf", col:"var(--mint)", maps:"Biergarten, Bellandur, Bengaluru",
   desserts:[
     {name:"Hazelnut Chocolate Cake", desc:"Belgian chocolate and hazelnut ganache on soft chocolate cake. Eggless."},
     {name:"New York Cheesecake", desc:"Creamy baked cheesecake sitting on a chocolate cookie crust."}
   ]},
  {id:"gladia", name:"Gladia", area:"Sarjapur Road", blurb:"Roman columns and sculptures everywhere. An art lover's dinner.", tags:["Art everywhere","Sushi & pizza"], icon:"column", col:"var(--sky)", maps:"Gladia Brewery & Kitchen, Sarjapur Road, Bengaluru",
   desserts:[
     {name:"Bitter Chocolate Fantasy", desc:"Rich, bittersweet dark chocolate layers. Basically made for you."},
     {name:"Lotus Biscoff Cheesecake", desc:"The one non-chocolate pick: creamy cheesecake with caramel Biscoff."}
   ]}
];
const GLENS = {name:"Glen's Bakehouse", area:"Sarjapur Road", desserts:[
  {name:"Dark Choco Mousse Cake", desc:"A little cup of silky dark chocolate mousse."},
  {name:"Hot Fudge Nutty Sundae", desc:"Warm chocolate nut fudge melting over ice cream."},
  {name:"Choco Walnut Brownie", desc:"Fudgy, gooey, with a walnut crunch."},
  {name:"Belgian Choco Classic", desc:"Proper Belgian chocolate cake. No notes."},
  {name:"Willy's Hot Chocolate", desc:"Their in-house hot chocolate, perfect if it rains."}
]};
const STEPS = ["hello","pottery","dinner","dessert","ticket","done"];

/* ---------- state ---------- */
const blank = {step:"hello", day:"", place:"", dessert:"", at:"", glens:false, note:"", sent:0};
let S = Object.assign({}, blank);
const save = () => { try{ localStorage.setItem("bhavana-date-v2", JSON.stringify(S)); }catch(e){} };
const load = () => { try{ const v = JSON.parse(localStorage.getItem("bhavana-date-v2")||"null"); if (v && STEPS.includes(v.step)) return v; }catch(e){} return null; };
function esc(s){ return String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const place = () => PLACES.find(p => p.id === S.place);
const dayText = () => { const d = DAYS.find(x => x.id === S.day); return d ? `${d.day}, ${d.date}` : ""; };

/* ---------- drawings ---------- */
const heart = (x, y, s, fill, cls, delay) => `<use href="#h" x="${x}" y="${y}" width="${s}" height="${s}" fill="${fill}" class="${cls||""}" style="animation-delay:${delay||0}s"/>`;
const spark = (x, y, s, fill, delay) => `<use href="#spark" x="${x}" y="${y}" width="${s}" height="${s}" fill="${fill}" class="twinkle" style="animation-delay:${delay||0}s"/>`;
const art = {
  pottery: `<svg viewBox="0 0 320 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A pot spinning on a pottery wheel">
    <rect width="320" height="220" fill="#ffd9e4"/><circle cx="160" cy="118" r="92" fill="#ffc2d4"/>
    ${spark(40,40,16,"#fff",0)}${spark(262,58,12,"#fff",.8)}${spark(272,150,18,"#ff8fb0",1.4)}${spark(30,150,12,"#ff8fb0",.4)}
    <ellipse cx="160" cy="206" rx="104" ry="8" fill="#f3a9bf"/>
    <path d="M118 160h84l12 44H106z" fill="#5b2a3c"/><path d="M118 160h14l-12 44h-14z" fill="#fff" opacity=".12"/>
    <ellipse cx="160" cy="160" rx="96" ry="19" fill="#7a3a52"/><ellipse cx="160" cy="156" rx="96" ry="19" fill="#9c4f6c"/>
    <ellipse class="spin" cx="160" cy="156" rx="78" ry="14" fill="none" stroke="#ffd0de" stroke-width="3" stroke-dasharray="12 16"/>
    <g class="bob"><path d="M126 156c-13-26-10-50 10-62-5-10-3-17 4-21h40c7 4 9 11 4 21 20 12 23 36 10 62z" fill="url(#clay)"/>
      <path d="M134 98c-14 12-16 34-6 54" stroke="#fff" stroke-opacity=".4" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="160" cy="73" rx="20" ry="5" fill="#9a4226"/>
      ${heart(147,108,26,"#fff")}</g>
    ${heart(150,40,16,"#ff3d73","float",0)}${heart(170,48,12,"#ff6992","float",1)}${heart(140,52,10,"#ff3d73","float",2)}
  </svg>`,
  letter: `<svg viewBox="0 0 320 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A love letter with a heart seal">
    <rect width="320" height="220" fill="#ffd9e4"/><circle cx="160" cy="116" r="94" fill="#ffc2d4"/>
    ${spark(36,36,16,"#fff",0)}${spark(268,50,14,"#fff",.7)}${spark(276,160,18,"#ff8fb0",1.3)}${spark(28,158,12,"#ff8fb0",.3)}
    <ellipse cx="160" cy="196" rx="96" ry="8" fill="#f3a9bf"/>
    <g class="bob">
      <rect x="84" y="66" width="152" height="40" rx="8" fill="#fff" transform="rotate(-6 160 86)"/>
      <path d="M100 78h96M100 90h70" stroke="#ffc2d4" stroke-width="5" stroke-linecap="round" transform="rotate(-6 160 86)"/>
      <rect x="74" y="92" width="172" height="98" rx="14" fill="#ff6992"/>
      <path d="M74 106l86 52 86-52v70a14 14 0 0 1-14 14H88a14 14 0 0 1-14-14z" fill="#ff3d73"/>
      <path d="M74 106l86 52 86-52" stroke="#d92a5c" stroke-width="3" fill="none" stroke-linejoin="round"/>
      <circle cx="160" cy="152" r="20" fill="#fff"/>${heart(148,140,24,"#ff3d73")}
    </g>
    ${heart(206,58,18,"#ff3d73","float",0)}${heart(108,52,14,"#ff6992","float",1.1)}${heart(226,80,12,"#ff3d73","float",2)}
  </svg>`,
  dinner: `<svg viewBox="0 0 320 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A dinner table for two">
    <rect width="320" height="220" fill="#ffe6c9"/>
    <path d="M0 26 Q80 56 160 30 T320 28" stroke="#c98f5a" stroke-width="2" fill="none"/>
    ${[30,72,114,156,198,240,282].map((x,i)=>`<circle cx="${x}" cy="${40 + (i%2?-4:6)}" r="7" fill="${i%2?"#ffb648":"#ff8fb0"}" class="twinkle" style="animation-delay:${i*.3}s"/>`).join("")}
    <ellipse cx="160" cy="176" rx="150" ry="34" fill="#ffd2a8"/><ellipse cx="160" cy="170" rx="150" ry="34" fill="#fff4ea"/>
    <ellipse cx="104" cy="166" rx="40" ry="13" fill="#fff" stroke="#f3c8a3" stroke-width="3"/><ellipse cx="104" cy="164" rx="24" ry="7" fill="#ffb648"/>
    <ellipse cx="216" cy="166" rx="40" ry="13" fill="#fff" stroke="#f3c8a3" stroke-width="3"/><ellipse cx="216" cy="164" rx="24" ry="7" fill="#38c08f"/>
    <rect x="153" y="112" width="14" height="46" rx="4" fill="#fff" stroke="#f3c8a3" stroke-width="2"/>
    <path class="bob" d="M160 90c8 8 8 18 0 22-8-4-8-14 0-22z" fill="#ffb648"/>
    ${heart(60,92,22,"#ff3d73","float",0)}${heart(240,96,18,"#ff6992","float",1.2)}
  </svg>`,
  cake: `<svg viewBox="0 0 320 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A slice of chocolate cake">
    <rect width="320" height="220" fill="#f6d6c8"/><circle cx="160" cy="120" r="88" fill="#efbfa9"/>
    ${spark(46,44,16,"#fff",0)}${spark(262,40,12,"#fff",.9)}${spark(270,160,16,"#c9785b",1.5)}
    <ellipse cx="160" cy="190" rx="110" ry="12" fill="#e0a891"/>
    <g class="bob"><path d="M78 176l150-64 18 64z" fill="#3e1c14"/>
      <path d="M78 176h168v14H78z" fill="url(#choc)"/>
      <path d="M78 150h168v12H78z" fill="#f7c1a6" opacity=".9" transform="translate(0 14)"/>
      <path d="M78 176L228 112c6 10 10 22 18 64z" fill="url(#choc)"/>
      <path d="M78 176L228 112" stroke="#8a4a32" stroke-width="6" stroke-linecap="round"/>
      <path d="M120 158c0 10 6 12 6 4M170 137c0 12 6 14 6 4M205 122c0 10 5 12 5 3" stroke="#5a2a1c" stroke-width="6" stroke-linecap="round" fill="none"/>
      ${heart(212,84,30,"#ff3d73")}</g>
  </svg>`
};
const ic = {
  shake:`<svg viewBox="0 0 48 48"><path d="M14 16h20l-3 26H17z" fill="#fff"/><path d="M15.5 24h17l-2 18h-13z" fill="#6b3424"/><path d="M12 16c1-7 23-7 24 0z" fill="#fff"/><circle cx="26" cy="7" r="4" fill="#ff3d73"/><path d="M30 10l7-7" stroke="#4a241c" stroke-width="3" stroke-linecap="round"/></svg>`,
  leaf:`<svg viewBox="0 0 48 48"><path d="M10 38C10 18 22 8 40 8c0 20-10 30-30 30z" fill="#fff"/><path d="M12 36L34 14" stroke="#1f8a63" stroke-width="3" stroke-linecap="round"/><path d="M20 28l-2-8M26 22l-1-7M20 28l8 1M26 22l8 1" stroke="#1f8a63" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  column:`<svg viewBox="0 0 48 48"><rect x="8" y="7" width="32" height="6" rx="2" fill="#fff"/><rect x="12" y="13" width="24" height="3" fill="#2b4f9a"/><rect x="14" y="16" width="20" height="20" fill="#fff"/><path d="M19 18v16M24 18v16M29 18v16" stroke="#6aa8ff" stroke-width="2"/><rect x="10" y="36" width="28" height="6" rx="2" fill="#fff"/></svg>`,
  cake:`<svg viewBox="0 0 48 48"><path d="M8 34l28-12 4 12z" fill="#3e1c14"/><path d="M8 34h32v7H8z" fill="#6b3424"/><path d="M8 34l28-12" stroke="#8a4a32" stroke-width="3" stroke-linecap="round"/><use href="#h" x="28" y="10" width="14" height="14" fill="#ff3d73"/></svg>`,
  cupcake:`<svg viewBox="0 0 48 48"><path d="M13 24h22l-4 18H17z" fill="#fff"/><path d="M18 24l2 18M24 24v18M30 24l-2 18" stroke="#ff9b6a" stroke-width="2"/><path d="M11 25c0-9 7-13 13-13s13 4 13 13z" fill="#6b3424"/><circle cx="24" cy="10" r="4" fill="#ff3d73"/></svg>`,
  wheel:`<svg viewBox="0 0 48 48"><ellipse cx="24" cy="36" rx="18" ry="5" fill="#fff"/><path d="M17 35c-3-7-2-13 3-16-1-3 0-5 1-6h6c1 1 2 3 1 6 5 3 6 9 3 16z" fill="#fff"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  arrow:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  heart:`<svg viewBox="0 0 24 24"><use href="#h" fill="currentColor"/></svg>`
};

/* ---------- recording her answers ---------- */
function record(status){
  const p = place();
  const body = new URLSearchParams();
  body.append(F.status, status);
  body.append(F.day, dayText());
  body.append(F.dinner, p ? p.name + ", " + p.area : "");
  body.append(F.dessert, S.dessert);
  body.append(F.at, S.at);
  body.append(F.note, S.note.trim());
  return fetch(FORM, {method:"POST", mode:"no-cors", body});
}
let sending = false;
function confirmPicks(e){
  if (sending) return;
  sending = true;
  const b = document.getElementById("confirm");
  if (b){ b.disabled = true; b.innerHTML = "Sending your picks..."; }
  record(S.sent ? "Updated picks" : "Confirmed").then(() => {
    sending = false; S.sent = (S.sent||0) + 1; popHeart(e); go("done");
  }).catch(() => {
    sending = false;
    if (b){ b.disabled = false; b.innerHTML = "Try again"; }
    const m = document.getElementById("err"); if (m) m.textContent = "Hmm, that didn't go through. Check your internet and tap again.";
  });
}

/* ---------- screens: [body, button] ---------- */
const radio = `<i class="radio" aria-hidden="true">${ic.check}</i>`;
const screens = {
  hello: () => [`<div class="hero">${art.letter}</div>
    <span class="kicker">${ic.heart.replace("<svg","<svg width='14' height='14'")} For Bhavana</span>
    <h1>Free for a little adventure?</h1>
    <p class="sub">I've planned our whole evening: clay, a cosy dinner and dark chocolate. All you have to do is pick your favourites. I'll take care of the rest.</p>`,
    `<button class="btn" data-go="pottery">Show me the plan ${ic.arrow}</button>`],

  pottery: () => [`<div class="hero">${art.pottery}</div>
    <span class="kicker">Stop 1 of 3</span>
    <h2>First, we get our hands a little messy.</h2>
    <p class="sub">Couple pottery on the wheel at Thirdspace Art Café, Koramangala. We each take home something we made. Wonky pots are very much encouraged.</p>
    <p class="q">Which evening is ours?</p>
    <div class="grid2">${DAYS.map(d => `<button class="day ${S.day===d.id?"sel":""}" data-day="${d.id}" aria-pressed="${S.day===d.id}"><small>${d.day==="Wednesday"?"Midweek treat":"Almost-weekend"}</small><b>${d.day.slice(0,3)}</b><span>${d.date}, 4 PM-ish</span></button>`).join("")}</div>`,
    `<button class="btn" data-go="dinner" ${S.day?"":"disabled"}>Lock it in ${ic.arrow}</button>`],

  dinner: () => [`<div class="hero">${art.dinner}</div>
    <span class="kicker">Stop 2 of 3</span>
    <h2>Then, we feed the artists.</h2>
    <p class="sub">Three very different moods: one playful, one leafy, one straight out of ancient Rome. Which one sounds like your kind of evening?</p>
    <div class="list">${PLACES.map(p => `<div class="pw"><button class="pick ${S.place===p.id?"sel":""}" data-place="${p.id}" aria-pressed="${S.place===p.id}"><span class="ic" style="background:${p.col}">${ic[p.icon]}</span><span><b>${p.name}</b><p>${p.area}. ${p.blurb}</p><span class="tags">${p.tags.map(t=>`<em>${t}</em>`).join("")}</span></span>${radio}</button><a class="photos" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.maps)}" target="_blank" rel="noopener">See photos on Google ${ic.arrow}</a></div>`).join("")}</div>`,
    `<button class="btn" data-go="dessert" ${S.place?"":"disabled"}>Now the sweet part ${ic.arrow}</button>`],

  dessert: () => {
    const p = place() || PLACES[0];
    const where = S.glens ? GLENS.name : p.name;
    const list = S.glens ? GLENS.desserts : p.desserts;
    return [`<div class="hero">${art.cake}</div>
    <span class="kicker">Stop 3 of 3</span>
    <h2>${S.glens ? "Glen's it is. Pick your treat." : "And finally, chocolate."}</h2>
    <p class="sub">${S.glens ? "A cosy little bakery just down Sarjapur Road. Cakes, sundaes and hot chocolate, in case it rains." : `Hand-picked from ${p.name}'s menu, because dark chocolate is your thing.`}</p>
    <div class="list">${list.map(d => `<button class="pick ${S.dessert===d.name&&S.at===where?"sel":""}" data-dessert="${esc(d.name)}" data-at="${esc(where)}" aria-pressed="${S.dessert===d.name&&S.at===where}"><span class="ic" style="background:${S.glens?"var(--peach)":"#f1c6b4"}">${S.glens?ic.cupcake:ic.cake}</span><span><b>${d.name}</b><p>${d.desc}</p></span>${radio}</button>`).join("")}</div>
    <button class="swap" id="glens"><span class="ic">${S.glens?ic.cake:ic.cupcake}</span><span><b>${S.glens ? "Actually, take me back to " + p.name : "Nothing calling your name?"}</b><span>${S.glens ? "Their desserts are still there." : "We'll pop over to Glen's Bakehouse on Sarjapur Road instead."}</span></span></button>
    <p class="fine">From their current menus, which can change a little.</p>`,
    `<button class="btn" data-go="ticket" ${S.dessert?"":"disabled"}>See our evening ${ic.arrow}</button>`];
  },

  ticket: () => [ticketHtml() + `
    <label for="note">Anything I should know?</label>
    <textarea id="note" placeholder="Allergies, cravings, or a song for the ride">${esc(S.note)}</textarea>`,
    `<p class="err" id="err" role="alert"></p><button class="btn" id="confirm">It's a date! ${ic.arrow}</button>`],

  done: () => [`<div class="hero">${art.pottery}</div>
    <h1>Yay! It's a date.</h1>
    <p class="sub">Your picks just flew straight to me. Now I'll sort the bookings, and you only have to show up looking cute and ready to get a little clay on your hands.</p>
    <div class="sent">${ic.check} Sent to Samyak</div>
    ${ticketHtml(true)}
    <button class="link" id="restart">Want to change something?</button>`,
    `<button class="btn alt" id="again">See you ${S.day==="wed"?"Wednesday":"Thursday"} ${ic.heart.replace("<svg","<svg width='20' height='20'")}</button>`]
};
function ticketHtml(bare){
  const p = place() || PLACES[0];
  return `${bare ? "" : `<span class="kicker">Our evening</span>
    <h2>Here's how it goes.</h2>`}
    <div class="ticket">
      <div class="top"><small>Admit two</small><b>${dayText()}</b><svg viewBox="0 0 24 24"><use href="#h" fill="#fff" opacity=".9"/></svg></div>
      <div class="perf"></div>
      <ul class="stops">
        <li><span class="dot" style="background:#ff8fb0">${ic.wheel}</span><span><small>4 PM-ish</small><b>Pottery at Thirdspace Art Café</b></span></li>
        <li><span class="dot" style="background:${p.col}">${ic[p.icon]}</span><span><small>Dinner</small><b>${p.name}, ${p.area}</b></span></li>
        <li><span class="dot" style="background:${S.at===GLENS.name?"var(--peach)":"#f1c6b4"}">${S.at===GLENS.name?ic.cupcake:ic.cake}</span><span><small>Dessert</small><b>${esc(S.dessert)}</b> <span style="color:var(--muted)">at ${esc(S.at)}</span></span></li>
      </ul>
    </div>`;
}

/* ---------- render ---------- */
const stage = document.getElementById("stage"), cta = document.getElementById("cta");
const prog = [...document.querySelectorAll("#prog i")], count = document.getElementById("count"), backBtn = document.getElementById("back");
function render(){
  const [body, btn] = screens[S.step]();
  stage.innerHTML = `<div class="enter">${body}</div>`;
  cta.innerHTML = btn;
  const i = STEPS.indexOf(S.step);
  prog.forEach((el, k) => el.classList.toggle("on", k < i));
  count.textContent = (i >= 1 && i <= 4) ? `${Math.min(i,4)} of 4` : "";
  backBtn.style.visibility = S.step === "hello" ? "hidden" : "visible";
  if (S.step === "done") burst();
  save();
}
function go(step){ S.step = step; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function popHeart(e){
  const x = e.clientX || window.innerWidth/2, y = e.clientY || window.innerHeight/2;
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("class","pop");
  s.innerHTML = '<use href="#h"/>'; s.style.left = x + "px"; s.style.top = y + "px";
  document.body.appendChild(s); setTimeout(() => s.remove(), 850);
}
function onClick(e){
  const t = e.target.closest("button,a");
  if (!t || t.disabled) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.day){ S.day = t.dataset.day; popHeart(e); return render(); }
  if (t.dataset.place){ if (S.place !== t.dataset.place){ S.dessert = ""; S.at = ""; S.glens = false; } S.place = t.dataset.place; popHeart(e); return render(); }
  if (t.dataset.dessert){ S.dessert = t.dataset.dessert; S.at = t.dataset.at; popHeart(e); return render(); }
  if (t.id === "glens"){ S.glens = !S.glens; S.dessert = ""; S.at = ""; return render(); }
  if (t.id === "restart"){ return go("pottery"); }
  if (t.id === "confirm") return confirmPicks(e);
  if (t.id === "again"){ popHeart(e); burst(); }
}
stage.addEventListener("click", onClick);
cta.addEventListener("click", onClick);
stage.addEventListener("input", e => { if (e.target.id === "note"){ S.note = e.target.value; save(); } });
backBtn.addEventListener("click", () => { const i = STEPS.indexOf(S.step); go(STEPS[Math.max(0, i-1)]); });

/* ---------- ambience ---------- */
let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
document.getElementById("bgfx").innerHTML = Array.from({length:12}, () => `<svg viewBox="0 0 24 24" style="left:${(rnd()*96).toFixed(1)}%;width:${(14+rnd()*16).toFixed(0)}px;height:auto;animation-duration:${(14+rnd()*12).toFixed(1)}s;animation-delay:-${(rnd()*20).toFixed(1)}s;opacity:${(.35+rnd()*.5).toFixed(2)}"><use href="#h"/></svg>`).join("");
const conf = document.getElementById("confetti");
function burst(){
  const cols = ["#ff3d73","#ffb648","#38c08f","#6aa8ff","#ff9b6a","#ff8fb0"];
  conf.innerHTML = Array.from({length:46}, (_, k) => `<svg viewBox="0 0 24 24" style="left:${(rnd()*100).toFixed(1)}%;animation-delay:${(rnd()*.9).toFixed(2)}s;animation-duration:${(2.3+rnd()*1.6).toFixed(2)}s"><use href="${k%3?"#h":"#spark"}" fill="${cols[k%6]}"/></svg>`).join("");
  setTimeout(() => { conf.innerHTML = ""; }, 5000);
}

/* ---------- boot ---------- */
function start(data){
  const prior = (data && data.step) ? data : load();
  if (prior && screens[prior.step]) S = Object.assign({}, blank, prior);
  render();
  let seen = false;
  try { seen = localStorage.getItem("bhavana-opened") === "1"; localStorage.setItem("bhavana-opened", "1"); } catch(e){}
  if (!seen) record("Opened the invite").catch(() => {});
}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
</script>
